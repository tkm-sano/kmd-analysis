<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#455765"/></marker></defs><rect width="1400" height="850" fill="white"/><g font-family="sans-serif" fill="#17232d"><text x="30" y="40" font-size="30">二経路の確認範囲と未検証の接続</text><text x="30" y="76" font-size="20">A：固定条件の保存結果で確認　B：文献・モデルに基づく条件付き推論　C：未検証（破線）</text><text x="30" y="122" font-size="23">配送計画：Aの到達点は採用前の計画品質である。</text><rect x="30" y="145" width="285" height="112" fill="#f4f7f9" stroke="#286a96" stroke-width="2"/><text x="42" y="173" font-size="19">A 古典初期解と支持</text><text x="42" y="201" font-size="19">matching／隣接交換／GM</text><text x="42" y="229" font-size="19">同じ入力・目的値・制約</text><rect x="365" y="145" width="310" height="112" fill="#f4f7f9" stroke="#286a96" stroke-width="2"/><text x="377" y="173" font-size="19">A CPU状態評価・標本候補</text><text x="377" y="201" font-size="19">候補のJと制約を検証</text><text x="377" y="229" font-size="19">実機の状態準備はC</text><rect x="725" y="145" width="295" height="112" fill="#f4f7f9" stroke="#286a96" stroke-width="2"/><text x="737" y="173" font-size="19">C 実運用の採用判断</text><text x="737" y="201" font-size="19">部分問題の選択・全体統合</text><text x="737" y="229" font-size="19">許容時間と全工程の照合</text><rect x="1070" y="145" width="300" height="112" fill="#f4f7f9" stroke="#286a96" stroke-width="2"/><text x="1082" y="173" font-size="19">C 実運用成果</text><text x="1082" y="201" font-size="19">実際の配送実行・走行DC</text><text x="1082" y="229" font-size="19">現在Bからの接続は未評価</text><path d="M315 201 L363 201" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M675 201 L723 201" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 5"/><path d="M1020 201 L1068 201" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 5"/><rect x="30" y="290" width="645" height="92" fill="#f4f7f9" stroke="#286a96" stroke-width="2"/><text x="42" y="318" font-size="19">A 限定matching支持の最小＝初期値、GMの規模別結果</text><text x="42" y="346" font-size="19">B 改善解の範囲内存在が厳密改善の必要条件である。</text><text x="42" y="374" font-size="19">広い支持も取得品質・採用の十分条件ではない。</text><text x="30" y="430" font-size="23">電池材料：①簡略推計の保存変換と、量子情報からの実用化を分離する。</text><rect x="30" y="452" width="285" height="112" fill="#f4f7f9" stroke="#a6522c" stroke-width="2"/><text x="42" y="480" font-size="19">B 量子材料評価の文献</text><text x="42" y="508" font-size="19">対象・精度・資源の推計</text><text x="42" y="536" font-size="19">対象LP/Sでの利用はC</text><rect x="365" y="452" width="310" height="112" fill="#f4f7f9" stroke="#a6522c" stroke-width="2"/><text x="377" y="480" font-size="19">C 情報の利用・電池設計</text><text x="377" y="508" font-size="19">試験・選択・設計採用</text><text x="377" y="536" font-size="19">出力・寿命・安全性</text><rect x="725" y="452" width="295" height="112" fill="#f4f7f9" stroke="#a6522c" stroke-width="2"/><text x="737" y="480" font-size="19">C 完成パック・実車成果</text><text x="737" y="508" font-size="19">完成質量・実車校正は未確認</text><text x="737" y="536" font-size="19">①の計算値を流用しない</text><path d="M315 508 L363 508" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 5"/><path d="M675 508 L723 508" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="8 5"/><rect x="30" y="610" width="400" height="114" fill="#f4f7f9" stroke="#a6522c" stroke-width="2"/><text x="42" y="638" font-size="19">A 文献参照入力 [Chen]</text><text x="42" y="666" font-size="19">保持率逆算LP/S比容量</text><text x="42" y="694" font-size="19">古典DFT・電極実験由来</text><text x="42" y="722" font-size="19">量子材料改善の結果ではない。</text><rect x="480" y="610" width="430" height="114" fill="#f4f7f9" stroke="#a6522c" stroke-width="2"/><text x="492" y="638" font-size="19">A ①塗工層＋固定34kg→質量→DC</text><text x="492" y="666" font-size="19">5.67%→0.478%→0.413%</text><text x="492" y="694" font-size="19">固定容量・同一旧速度・平坦</text><text x="492" y="722" font-size="19">回生・補機・荷重変化を除外</text><rect x="960" y="610" width="410" height="114" fill="#f4f7f9" stroke="#a6522c" stroke-width="2"/><text x="972" y="638" font-size="19">A ②既知部材差・完成質量未確定</text><text x="972" y="666" font-size="19">B ΔM=b−δ、δ=bで相殺</text><text x="972" y="694" font-size="19">担持量／面積固定でbが異なる。</text><text x="972" y="722" font-size="19">実用電池の成立境界ではない。</text><path d="M430 667 L478 667" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="787" font-size="21">B 共通の枠組み：技術的能力→適用判断→システム成果。各接続の実証状態は同一ではない。</text><text x="30" y="821" font-size="19">Aは実機・実車の因果効果ではない。面接・RIQ・M1や新規実験は今回の工程に含めない。</text></g></svg>