<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#455765"/></marker></defs><rect width="1400" height="780" fill="white"/><g font-family="sans-serif" fill="#17232d"><text x="30" y="38" font-size="29">量子計算の技術的能力から、適用判断と成果への接続</text><text x="30" y="72" font-size="20">実線：保存結果・モデル内の関係　破線：未検証の接続／条件候補</text><text x="30" y="119" font-size="22">配送計画：CPUによる理想化モデルの数値評価、時間窓なし</text><rect x="30" y="140" width="260" height="120" rx="5" fill="#f5f7f9" stroke="#286a96" stroke-width="2"/><text x="42" y="169" font-size="19">量子探索の技術能力</text><text x="42" y="197" font-size="19">GM-QAOA等のモデル評価</text><text x="42" y="225" font-size="19">実機資源は未保存</text><rect x="350" y="140" width="290" height="120" rx="5" fill="#f5f7f9" stroke="#286a96" stroke-width="2"/><text x="362" y="169" font-size="19">探索範囲・候補の取得</text><text x="362" y="197" font-size="19">改善解の存在と解品質</text><text x="362" y="225" font-size="19">限定交換では改善解なし</text><rect x="700" y="140" width="285" height="120" rx="5" fill="#f5f7f9" stroke="#286a96" stroke-width="2"/><text x="712" y="169" font-size="19">古典側での採用判断</text><text x="712" y="197" font-size="19">実行可能性・全体への統合</text><text x="712" y="225" font-size="19">許容計算時間との照合</text><rect x="1045" y="140" width="325" height="120" rx="5" fill="#f5f7f9" stroke="#286a96" stroke-width="2"/><text x="1057" y="169" font-size="19">計画上の成果</text><text x="1057" y="197" font-size="19">総移動時間・取得時刻</text><text x="1057" y="225" font-size="19">動的運用・DCへの接続は未検証</text><path d="M290,200 L348,200" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M640,200 L698,200" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="8 6"/><path d="M985,200 L1043,200" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="8 6"/><rect x="690" y="290" width="540" height="85" rx="5" fill="#f5f7f9" stroke="#455765" stroke-width="2"/><text x="702" y="319" font-size="19">許容計算時間＝入力更新から採用判断までの時間枠</text><text x="702" y="347" font-size="19">未測定。顧客時間窓・出発余裕の改名ではない。</text><path d="M840,290 L840,263" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="8 6"/><text x="30" y="422" font-size="22">電池材料：量子評価の先行研究と、文献入力による条件付き計算を区別する</text><rect x="30" y="447" width="260" height="120" rx="5" fill="#f5f7f9" stroke="#a6522c" stroke-width="2"/><text x="42" y="476" font-size="19">量子材料評価の技術能力</text><text x="42" y="504" font-size="19">精度・資源の先行研究</text><text x="42" y="532" font-size="19">対象材料への利用は未実施</text><rect x="350" y="447" width="290" height="120" rx="5" fill="#f5f7f9" stroke="#a6522c" stroke-width="2"/><text x="362" y="476" font-size="19">評価情報→試験・材料選択</text><text x="362" y="504" font-size="19">量子情報の有用性は未検証</text><text x="362" y="532" font-size="19">Chen入力は古典研究由来</text><rect x="700" y="447" width="285" height="120" rx="5" fill="#f5f7f9" stroke="#a6522c" stroke-width="2"/><text x="712" y="476" font-size="19">セル・パック設計の採用</text><text x="712" y="504" font-size="19">容量固定の質量推計</text><text x="712" y="532" font-size="19">未知部材・出力・寿命・安全性</text><rect x="1045" y="447" width="325" height="120" rx="5" fill="#f5f7f9" stroke="#a6522c" stroke-width="2"/><text x="1057" y="476" font-size="19">質量→走行DC</text><text x="1057" y="504" font-size="19">同一保存速度の条件付き計算</text><text x="1057" y="532" font-size="19">5.67%→0.478%→0.413%</text><path d="M290,507 L348,507" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="8 6"/><path d="M640,507 L698,507" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#a)" stroke-dasharray="8 6"/><path d="M985,507 L1043,507" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="320" y="610" width="510" height="95" rx="5" fill="#f5f7f9" stroke="#a6522c" stroke-width="2"/><text x="332" y="639" font-size="19">文献入力（比容量逆算）＋容量20 kWh固定</text><text x="332" y="667" font-size="19">電極・集電体・セパレータ・電解液の別途評価</text><text x="332" y="695" font-size="19">完成パック183値は全て未確定</text><path d="M830,635 L855,570" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="905" y="610" width="465" height="95" rx="5" fill="#f5f7f9" stroke="#455765" stroke-width="2"/><text x="917" y="639" font-size="19">走行条件による修飾</text><text x="917" y="667" font-size="19">速度・転がり係数・平坦・効率0.90</text><text x="917" y="695" font-size="19">回生・補機・荷重変化除外、保存区間のみ</text><path d="M1180,610 L1180,570" stroke="#455765" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="30" y="754" font-size="21">共通性は「適用判断」の分析構造にある。二経路の全接続や量子優位性を実証した図ではない。</text></g></svg>