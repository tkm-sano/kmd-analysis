   <text style="font-size: 7.02px; font-family: 'Source Han Sans JP'; fill: #52616b" transform="translate(21.6 435.78263)">本表はsynthetic customer configurationおよびroute proxyに基づく。東京都の実配送における観測失敗率を示すものではない。各数値は車両性能、顧客需要、配送可能時間、充電条件、</text>
   <text style="font-size: 7.02px; font-family: 'Source Han Sans JP'; fill: #52616b" transform="translate(21.6 444.521981)">およびルート生成方法の仮定に依存する。</text>
  </g>
