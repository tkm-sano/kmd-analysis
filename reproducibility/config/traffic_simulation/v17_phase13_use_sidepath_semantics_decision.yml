decision_method:
  general_principle: >-
    Prefer a versioned amendment when a change is wholly within an existing
    decision's approved semantics and scope; use a conformance fix when only
    wiring already-approved semantics; create a separate decision when a new
    meaning, value semantic, or interpretation boundary would not be
    predictable from the existing decision.
  selected_method: new_independent_decision
  rejected_method: versioned_amendment_to_DEC-P13-VEHICLE-ONTOLOGY-001
  rationale: >-
    DEC-P13-VEHICLE-ONTOLOGY-001 decides that bicycle has an empty intersection
    with the governed motorized universe. It does not decide that use_sidepath
    means parallel_way_required, nor which access keys may use that value.
    Adding those meanings to the ontology decision would mix vehicle-domain
    responsibility with access-value responsibility and weaken traceability.
  differs_from_general_principle: false

responsibility_boundary:
  existing_decision:
    decision_id: DEC-P13-VEHICLE-ONTOLOGY-001
    owns:
      - bicycle_governed_vehicle_domain_is_empty
      - governed_permission_effect_is_none
      - source_record_is_preserved
      - formal_exclusion_is_false
  this_decision_owns:
    - use_sidepath_normalizes_to_parallel_way_required
    - use_sidepath_is_not_rewritten_to_no
    - approved_key_applicability_is_explicit_and_key_scoped
  runtime_conformance_owns:
    - registry_applicability_is_enforced_before_rule_construction
    - empty_domain_prevents_effect_on_governed_static_maxima
  explicitly_out_of_scope:
    - vehicle_ontology_changes
    - foot_use_sidepath
    - vehicle_and_motor_vehicle_child_parent_specificity
    - graph_resolution_of_the_parallel_sidepath

