future_extension:
  foot_can_reuse_this_decision: true
  mechanism: versioned_amendment_after_independent_specificity_resolution
  boundary: >-
    A future version may add foot to approved_base_keys because the access-value
    meaning is the same. The vehicle=no versus motor_vehicle=yes specificity
    issue belongs to a separate decision or conformance fix and must be resolved
    before foot is activated.

mandatory_boundaries:
  - use_sidepath is not rewritten or normalized to no
  - only bicycle is approved in decision version 1.0.0
  - access vehicle motor_vehicle and foot remain unsupported for use_sidepath
  - the bicycle vehicle domain remains exactly empty
  - governed vClasses are unchanged
  - no governed static maximum may cite the bicycle use_sidepath rule
  - no Way-specific exception is authorized
  - source OSM and prior Phase 13 artifacts remain immutable
  - foot use_sidepath and child-over-parent specificity remain separate work

