    P_osm_named_children: [bus, taxi, minibus, share_taxi]
    C_osm_branch: [tourist_bus, coach]
    P_intersection_G: [bus, taxi]
    C_intersection_P: []
  propositions:
    - bus_is_a_direct_psv_child
    - taxi_is_a_direct_psv_child
    - coach_is_not_a_psv_child
    - coach_belongs_to_the_separate_tourist_bus_branch
    - SUMO_bus_coach_and_taxi_are_distinct_permission_classes
    - the_governed_psv_intersection_is_exactly_bus_and_taxi

decision:
  result: approved_governed_intersection
  rule_id: OSM_PSV_TO_GOVERNED_BUS_TAXI_V1
  source_base_key: psv
  registered_vehicle_domain: [bus, taxi]
  class_intersections:
    bus: true
    coach: false
    taxi: true
  permission_effect_on_managed_delivery: none
  source_record_preserved: true
  formal_exclusion: false
  rationale: >-
    In the fixed OSM access hierarchy, bus and taxi are direct children of psv.
    Coach is instead a separate key under tourist_bus, and SUMO represents coach
    separately from urban-line bus and taxi. Therefore psv intersects the governed
    universe at bus and taxi only; it must not grant or deny SUMO coach or delivery.

mandatory_boundaries:
  - an explicit bus or taxi child tag overrides psv only for that child class
  - psv does not grant or deny the SUMO coach vClass
  - coach and tourist_bus require their own registered ontology decisions
  - the nine tourist_bus=yes co-occurrences remain separate source constraints
  - psv does not grant or deny the managed delivery vClass
  - psv is an OSM ontology term here and is not treated as a claim that UK statutory PSV law applies in Japan
  - scalar, lane, directional and conditional syntax must each pass their registered syntax validators
  - empty lane-vector positions remain no statement and must not be converted to yes or no
  - source Way ID, source key, source value, lane position and provenance must be preserved
  - the record remains governed and must not be moved to the exclusion population
  - unregistered public-service subtypes and unsupported syntax remain fail-closed

