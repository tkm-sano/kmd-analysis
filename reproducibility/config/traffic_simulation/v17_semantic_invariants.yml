schema_version: 17
invariant_set_id: ota_ward_attribute_resolution_semantic_invariants_v17
version: 1.3.0
policy_id: ota_ward_attribute_resolution_policy_v17
invariants:
  - {invariant_id: AR-STATE-001, scope: resolution_record, assertion: resolved records have a non-null effective value and origin and a null stop code, failure_status: invalid, stop_code: UNREGISTERED_STATE, severity: critical, target_phase: 3}
  - {invariant_id: AR-STATE-002, scope: resolution_record, assertion: non-resolved records have null effective value and origin and one registered stop code, failure_status: invalid, stop_code: UNREGISTERED_STOP_CODE, severity: critical, target_phase: 3}
  - {invariant_id: AR-STATE-003, scope: formal_record, assertion: formal records contain neither model_assumed nor assumption IDs, failure_status: invalid, stop_code: UNREGISTERED_STATE, severity: critical, target_phase: 3}
  - {invariant_id: AR-STATE-004, scope: v17_writer, assertion: v17 output does not contain value_state, failure_status: invalid, stop_code: LEGACY_STATE_MAPPING_UNSUPPORTED, severity: major, target_phase: 3}
  - {invariant_id: AR-STATE-005, scope: conflict_record, assertion: conflicts retain at least two candidates and provenance, failure_status: invalid, stop_code: UNREGISTERED_STATE, severity: major, target_phase: 3}
  - {invariant_id: AR-ID-001, scope: resolution_record, assertion: record_id equals SHA-256 of RFC 8785 canonical record key JSON, failure_status: invalid, stop_code: DIRECTED_SEGMENT_LINEAGE_INVALID, severity: critical, target_phase: 3}
  - {invariant_id: AR-ID-002, scope: resolution_collection, assertion: record IDs are unique and contain no mutable result fields, failure_status: conflict, stop_code: UNREGISTERED_RULE, severity: critical, target_phase: 3}
  - {invariant_id: AR-ID-003, scope: classification_projection, assertion: classification_record_id and projection hash are unchanged by resolution, failure_status: gate_failed, stop_code: null, severity: critical, target_phase: 14}
  - {invariant_id: AR-DIR-001, scope: directed_segment, assertion: source_start_index is less than source_end_index and both index the immutable source Way, failure_status: invalid, stop_code: DIRECTED_SEGMENT_LINEAGE_INVALID, severity: critical, target_phase: 4}
  - {invariant_id: AR-DIR-002, scope: directed_segment, assertion: forward and backward use the same canonical interval and exact source-node lineage, failure_status: invalid, stop_code: DIRECTED_SEGMENT_LINEAGE_INVALID, severity: critical, target_phase: 4}
  - {invariant_id: AR-DIR-003, scope: direction_generation, assertion: oneway minus one generates backward only without mutating the source Way, failure_status: invalid, stop_code: DIRECTED_SEGMENT_LINEAGE_INVALID, severity: critical, target_phase: 4}
  - {invariant_id: AR-DIR-004, scope: relation_mapping, assertion: candidate count one is adopted and zero or multiple candidates stop, failure_status: conflict, stop_code: RELATION_DIRECTED_MAPPING_AMBIGUOUS, severity: critical, target_phase: 4}
  - {invariant_id: AR-DIR-005, scope: direction_evidence, assertion: SUMO edge ID sign and nearest-coordinate matching are not formal direction evidence, failure_status: invalid, stop_code: DIRECTED_SEGMENT_LINEAGE_INVALID, severity: critical, target_phase: 4}
  - {invariant_id: AR-LANE-001, scope: directional_lanes, assertion: total equals forward plus backward plus both-ways lane counts, failure_status: conflict, stop_code: LANE_COUNT_CONFLICT, severity: critical, target_phase: 5}
  - {invariant_id: AR-LANE-002, scope: directional_lane_vector, assertion: vector length equals resolved directional moving-lane count, failure_status: conflict, stop_code: LANE_VECTOR_LENGTH_MISMATCH, severity: critical, target_phase: 5}
  - {invariant_id: AR-LANE-003, scope: formal_directional_lanes, assertion: formal profile never uses the even-split structural assumption, failure_status: invalid, stop_code: LANE_DIRECTIONAL_ALLOCATION_MISSING, severity: critical, target_phase: 5}
  - {invariant_id: AR-LANE-004, scope: lane_materialization, assertion: SUMO index equals lane count minus one minus resolver lane position, failure_status: invalid, stop_code: LANE_VECTOR_LENGTH_MISMATCH, severity: major, target_phase: 5}
  - {invariant_id: AR-SPEED-001, scope: speed_materialization, assertion: SUMO mps equals canonical kmh divided by 3.6, failure_status: invalid, stop_code: SPEED_VALUE_INVALID, severity: major, target_phase: 9}
  - {invariant_id: AR-SPEED-002, scope: speed_resolution, assertion: directional asymmetric speed is retained and higher-priority evidence is not overwritten, failure_status: conflict, stop_code: SPEED_VALUE_INVALID, severity: critical, target_phase: 9}
  - {invariant_id: AR-SPEED-003, scope: conditional_speed, assertion: interval changes are split by an approved transformation or stopped, failure_status: conflict, stop_code: SPEED_WITHIN_INTERVAL_CHANGE, severity: critical, target_phase: 9}
  - {invariant_id: AR-ACCESS-001, scope: access_rule, assertion: direction and lane target scope are separate from spatial vehicle temporal and purpose domains, failure_status: invalid, stop_code: UNREGISTERED_RULE, severity: critical, target_phase: 6}
  - {invariant_id: AR-ACCESS-002, scope: access_rule, assertion: vehicle domains are explicit subsets from the registered ontology, failure_status: unresolved, stop_code: ACCESS_VEHICLE_HIERARCHY_MISSING, severity: critical, target_phase: 6}
  - {invariant_id: AR-ACCESS-003, scope: access_resolution, assertion: dominated rules are removed and different-effect maximal rules stop, failure_status: conflict, stop_code: ACCESS_SPECIFICITY_CONFLICT, severity: critical, target_phase: 8}
  - {invariant_id: AR-ACCESS-004, scope: access_resolution, assertion: independent record order does not alter results and equal maximal provenance is retained, failure_status: conflict, stop_code: ACCESS_SPECIFICITY_CONFLICT, severity: critical, target_phase: 8}
  - {invariant_id: AR-ACCESS-005, scope: formal_permissions, assertion: typemap permissions are not formal authority and all governed tuples are covered, failure_status: unresolved, stop_code: ACCESS_PERMISSION_UNRESOLVED, severity: critical, target_phase: 8}
  - {invariant_id: AR-ACCESS-009, scope: vehicle_domain_intersection, assertion: tags specific to registered non-governed vehicle classes have an explicit empty domain and never change governed vehicle permissions, failure_status: invalid, stop_code: ACCESS_VEHICLE_HIERARCHY_MISSING, severity: critical, target_phase: 13}
  - {invariant_id: AR-ACCESS-010, scope: vehicle_domain_intersection, assertion: "approved psv domain is exactly {bus, taxi}; coach and delivery are excluded; explicit bus and taxi child tags override psv for their child class only; tourist_bus/coach remain separate and unknown unsupported values and syntax remain fail-closed", failure_status: invalid, stop_code: ACCESS_VEHICLE_HIERARCHY_MISSING, severity: critical, target_phase: 13}
  - {invariant_id: AR-COND-001, scope: conditional_evaluation, assertion: missing required context is not treated as false, failure_status: unresolved, stop_code: ACCESS_CONTEXT_MISSING, severity: critical, target_phase: 7}
  - {invariant_id: AR-COND-002, scope: conditional_evaluation, assertion: unsupported syntax is retained and stopped rather than ignored, failure_status: valid_but_unsupported, stop_code: ACCESS_CONDITIONAL_SYNTAX_UNSUPPORTED, severity: critical, target_phase: 7}
  - {invariant_id: AR-COND-003, scope: conditional_evaluation, assertion: last-match applies only within one tag and independent tags use dominance, failure_status: conflict, stop_code: ACCESS_SPECIFICITY_CONFLICT, severity: major, target_phase: 7}
  - {invariant_id: AR-COND-004, scope: conditional_evaluation, assertion: within-interval permission changes are split or stopped, failure_status: conflict, stop_code: ACCESS_WITHIN_INTERVAL_CHANGE, severity: critical, target_phase: 7}
  - {invariant_id: AR-EVID-001, scope: evidence_resolution, assertion: evidence-derived values name an approved registered method, failure_status: unresolved, stop_code: EVIDENCE_METHOD_NOT_APPROVED, severity: critical, target_phase: 10}
  - {invariant_id: AR-EVID-002, scope: evidence_resolution, assertion: donors are formally eligible and contain no structural assumption, failure_status: invalid, stop_code: EVIDENCE_DONOR_INELIGIBLE, severity: critical, target_phase: 10}
  - {invariant_id: AR-EVID-003, scope: manual_evidence, assertion: human evidence is a separate versioned artifact and production output is regenerated, failure_status: invalid, stop_code: EVIDENCE_METHOD_NOT_APPROVED, severity: major, target_phase: 10}
  - {invariant_id: AR-EXCL-001, scope: population, assertion: input population equals governed plus excluded population, failure_status: gate_failed, stop_code: null, severity: critical, target_phase: 12}
  - {invariant_id: AR-EXCL-002, scope: exclusion_manifest, assertion: every exclusion uses a registered rule and matching population version, failure_status: invalid, stop_code: EXCLUSION_RULE_UNREGISTERED, severity: critical, target_phase: 12}
  - {invariant_id: AR-EXCL-003, scope: materialization_omission, assertion: an omission is not an exclusion and original tuples remain in permission denominators, failure_status: gate_failed, stop_code: null, severity: critical, target_phase: 12}
  - {invariant_id: AR-BLOCK-001, scope: blocker_inventory, assertion: every blocker has exactly one preserve resolve formal exclusion or remain blocked strategy, failure_status: invalid, stop_code: UNREGISTERED_STATE, severity: critical, target_phase: 11}
  - {invariant_id: AR-BLOCK-002, scope: blocker_strategy, assertion: missing attributes unsupported implementation volume schedule and acceptance pressure never authorize exclusion, failure_status: invalid, stop_code: EXCLUSION_RULE_UNREGISTERED, severity: critical, target_phase: 11}
  - {invariant_id: AR-BLOCK-003, scope: permission_blocker, assertion: every permission blocker identifies its most upstream causal record IDs and is regenerated after upstream remediation, failure_status: invalid, stop_code: UNREGISTERED_STATE, severity: critical, target_phase: 11}
  - {invariant_id: AR-BLOCK-004, scope: exclusion_manifest, assertion: excluded records are neither resolved nor members of the governed population and governed excluded IDs do not overlap, failure_status: invalid, stop_code: EXCLUSION_RULE_UNREGISTERED, severity: critical, target_phase: 12}
  - {invariant_id: AR-PROV-001, scope: hash_bearing_artifacts, assertion: identity and acceptance JSON use RFC 8785 and reject duplicate keys, failure_status: invalid, stop_code: UNREGISTERED_RULE, severity: critical, target_phase: 11}
  - {invariant_id: AR-PROV-002, scope: run_manifest, assertion: all required environment input configuration schema registry log and output hashes are recorded, failure_status: gate_failed, stop_code: null, severity: critical, target_phase: 12}
  - {invariant_id: AR-PROV-003, scope: deterministic_run, assertion: two clean identical runs produce identical canonical artifact hashes, failure_status: gate_failed, stop_code: null, severity: critical, target_phase: 14}
  - {invariant_id: AR-PROV-004, scope: output_layout, assertion: structural and formal artifacts use separate non-overwriting paths, failure_status: invalid, stop_code: UNREGISTERED_RULE, severity: critical, target_phase: 12}
  - {invariant_id: AR-ACC-001, scope: attribute_resolution_acceptance, assertion: complete is true and blocker review stop and model-assumed counts are zero, failure_status: gate_failed, stop_code: null, severity: critical, target_phase: 14}
  - {invariant_id: AR-ACC-002, scope: attribute_resolution_acceptance, assertion: schema semantic oracle population projection and determinism validations all pass, failure_status: gate_failed, stop_code: null, severity: critical, target_phase: 14}
  - {invariant_id: AR-ACC-003, scope: attribute_resolution_acceptance, assertion: missing evidence yields not_run or failed and never passed, failure_status: gate_failed, stop_code: null, severity: critical, target_phase: 14}
