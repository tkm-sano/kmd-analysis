      - governed_equals_resolved_plus_unresolved_plus_conflict_plus_invalid_plus_valid_but_unsupported
      - governed_and_excluded_identifiers_do_not_overlap
    exit_gate:
      every_input_identity_accounted_exactly_once: true
      all_equations_valid: true
    failure_return: phase13_full_population_rerun

  - order: 4
