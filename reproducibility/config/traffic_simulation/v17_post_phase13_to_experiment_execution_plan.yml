      - blocker_count_by_attribute_stop_code_and_root_cause
      - no_new_unexplained_blocker
      - schema_and_semantic_consistency
      - identity_uniqueness
      - population_equations
      - blocker_exclusion_consistency
      - two_run_determinism
    exit_gate:
      both_runs_passed: true
      determinism_passed: true
      blocker_reduction_or_resolution_explained_by_registered_decisions: true
    failure_return: phase13_root_cause_resolution

  - order: 3
