      - updated_authority_registry_and_invariants
      - phase_fixtures_and_independent_oracles
      - regression_results
    exit_gate:
      all_selected_root_causes_processed: true
      no_unregistered_exclusion: true
      source_and_phase12_publication_unchanged: true
    failure_return: remain_in_phase13_and_record_the_unresolved_evidence_need

  - order: 2
