    sha256: e3de4b6aadd2e6bf0d0f6186d84c621bbf807e65b81bba9aec8fe0d7b0d77786
  inclusion_policy: explicit_whitelist
  enforcement_status: pending_build_pipeline
  unknown_type_policy: reject_unmatched_and_report_explicit_discard
  access_processing_scope: supported_tags_in_pinned_netconvert_configuration
  absence_of_type_defaults_is_validation: false
  road_function_and_surface_are_separate_axes: true
  track_exclusion_reason: land_access_function_outside_initial_general_motorized_network
  unsurfaced_highway_tag_status: deprecated_not_primary_surface_classifier
  surface_assessment:
    primary_tag: surface
    supporting_tags:
      - smoothness
      - tracktype
    retained_highway_may_still_be_unpaved: true
    unpaved_policy_status: pending_formal_rule
  typemap_must_not_default:
    - lanes
    - maxspeed
    - oneway
  retained_shared_highway_types:
    - motorway
    - motorway_link
    - trunk
    - trunk_link
    - primary
    - primary_link
    - secondary
    - secondary_link
    - tertiary
    - tertiary_link
    - residential
    - unclassified
    - living_street
    - service
  retained_compound_type_ids:
    - highway.service|psv
    - highway.service|bus
  retained_dedicated_motorized_type_ids:
    - highway.bus_guideway
    - highway.busway

access_resolution:
  osm_override_application_order:
    - access
    - vehicle
    - motor_vehicle
    - class_specific
    - direction_specific
    - lane_specific
  final_permission_composition: intersection_of_research_scope_and_resolved_osm_permissions
  resolve_osm_overrides_before_research_scope_intersection: true
  unknown_or_unsupported_rule: unresolved
  unsupported_conditional_rule: unresolved
  preserve_source_access_tags_until_permission_materialization: true
  permission_expectations_artifact_required: true
  resolver_fixtures:
    positive: 05_src/traffic_simulation/validation/fixtures/osm_attribute_resolution_positive.osm.xml
    negative_missing_required: 05_src/traffic_simulation/validation/fixtures/osm_attribute_resolution_negative.osm.xml
  class_specific_tags_to_validate:
    - motorcar
    - hgv
    - bus
    - delivery
  lane_specific_tags_to_validate:
    - access:lanes
    - vehicle:lanes
  service_is_classification_not_permission_override: true
  most_specific_explicit_restriction_expected: true
  exact_precedence_requires_pinned_runtime_fixture_validation: true
  evidence_priority:
    - versioned_source_backed_override
    - explicit_osm_attribute
  allow_permission_placeholder: false
  allow_unresolved_record_in_structural_audit: true
  allow_silent_typemap_fallback: false
  enforcement:
    compute_expected_permissions_before_netconvert: true
    compare_expected_with_generated_permissions: true
    materialize_expected_permissions_before_final_netconvert: true
