      - osm_defaults_annotation_did_not_report_missing_oneway

permission_materialization:
  contract_version: sumo_plain_xml_permissions_v3
  implementation_status: not_implemented
  fixture_status: not_run
  target_sumo_version: "1.24.0"
  evidence:
    schema_files_inspected_in_pinned_container:
      - /usr/share/sumo/data/xsd/edges_file.xsd
      - /usr/share/sumo/data/xsd/connections_file.xsd
    provisional_plain_export_probe:
      date: "2026-07-19"
      fixture: 05_src/traffic_simulation/validation/fixtures/osm_attribute_resolution_positive.osm.xml
      status: passed_with_known_importer_governance_warning
      establishes_only:
        - plain_edge_lane_origId_provenance_is_emitted
        - plain_edge_and_connection_files_are_accepted_interfaces
      does_not_establish:
        - permission_materializer_correctness
        - lane_index_mapping_correctness
        - connection_expectation_correctness
        - formal_build_eligibility
  provisional_export:
    input: normalized_topology_osm_xml_after_permission_expectation_capture
    remove_consumed_access_tags_from_topology_copy: true
    preserve_permission_expectations_as_separate_immutable_json: true
    required_netconvert_options:
      plain-output-prefix: governed_provisional
      plain-output.lanes: true
      output.original-names: true
      lefthand: true
      osm.lane-access: true
    required_files:
      nodes: governed_provisional.nod.xml
      edges: governed_provisional.edg.xml
      connections: governed_provisional.con.xml
      traffic_lights: governed_provisional.tll.xml
    required_roots:
      nodes: nodes
      edges: edges
      connections: connections
      traffic_lights: tlLogics
  expectation_artifact:
    schema_version: 2
    schema: reproducibility/config/traffic_simulation/schemas/permission_expectations.schema.json
    require_complete_true: true
    require_zero_blockers: true
  edge_provenance_artifact:
    schema_version: 1
    schema: reproducibility/config/traffic_simulation/schemas/edge_provenance.schema.json
    coordinate_matching_in_formal_profile: prohibited
    direction_source: exact_osm_node_lineage_indices
    forward_rule: source_start_index_less_than_source_end_index
    backward_rule: source_start_index_greater_than_source_end_index
    equal_or_ambiguous_index_policy: stop_PM008
  materialized_output:
    mutate_provisional_files_in_place: false
    edges: governed_permissions.edg.xml
    connections: governed_permissions.con.xml
    edge_permission_location: lane_allow_attribute
    connection_permission_location: connection_allow_attribute
    permission_serialization: space_separated_lexicographically_sorted_vclasses
    remove_disallow_when_writing_allow: true
    empty_lane_permission_policy:
      serialization: disallow_all
      attribute: disallow
      value: all
      pinned_runtime_fixture_required: true
      retain_only_as_explicitly_non_drivable_topology: true
      prohibit_use_by_any_vclass: true
    all_lanes_empty_edge_policy:
      action: remove_directed_edge_and_incident_connections
      reason_code: zero_permission_edge
      apply_before_tls_review: true
    empty_connection_policy: remove_connection_and_record_reason
    final_net_xml_is_audit_only: true
    tls_artifact_action: do_not_copy_provisional_tll_to_final_inputs
  provenance_mapping:
    lane_orig_id_source: lane_param_key_origId
    each_lane_requires_exactly_one_osm_way_id: true
    allow_one_osm_way_to_multiple_edges_and_lanes: true
    direction_rule: compare_each_sumo_edge_orientation_with_normalized_osm_way_node_order
    forward_definition: same_as_normalized_osm_way_node_order
    backward_definition: opposite_to_normalized_osm_way_node_order
    prohibit_edge_id_sign_as_direction_evidence: true
    ambiguous_or_incomplete_mapping_policy: stop
  lane_expectation_rule:
    resolver_lane_order: osm_left_to_right_when_viewed_in_travel_direction
    sumo_lane_index_order: right_to_left_when_viewed_in_travel_direction
    mapping_formula: sumo_lane_index_equals_lane_count_minus_one_minus_resolver_lane_position
    expected_allow_set: resolver_way_direction_lane_permission_intersect_typemap_baseline_intersect_governed_vclasses
    require_equal_lane_count_for_mapped_direction: true
    expected_set_must_be_subset_of_typemap_baseline: true
    fixture_must_confirm_order_under_lefthand_true: true
    fixture_mismatch_policy: stop_and_version_contract_before_real_data_use
    osm_lane_order_for_both_directions: left_to_right_viewed_in_respective_travel_direction
    backward_values_are_not_reversed_by_resolver: true
  permission_token_normalization:
    universe: governed_vclasses
    neither_allow_nor_disallow: all_governed_vclasses
    allow_all: all_governed_vclasses
    disallow_all: empty_set
    explicit_allow: listed_governed_vclasses
    explicit_disallow: governed_vclasses_minus_listed
    reject_empty_token: true
    reject_unknown_or_unmanaged_token: true
    reject_simultaneous_allow_and_disallow: true
  connection_expectation_rule:
    candidate_source: provisional_connections_only
    synthesize_missing_or_turn_restricted_connections: false
    expected_allow_set: from_lane_expected_allow_intersect_to_lane_expected_allow_intersect_provisional_connection_allow
    absent_provisional_allow_means: unrestricted_before_endpoint_intersection
    empty_expected_set: remove_connection_and_record_reason
    nonempty_expected_set: write_exact_sorted_allow_set
    identity_fields:
      - from
      - to
      - fromLane
      - toLane
    require_explicit_lane_to_lane_connection: true
    supported_nonconnection_elements:
      - prohibition
      - delete
    preserve_supported_element_only_with_resolved_references: true
    prohibited_elements:
      - crossing
      - walkingArea
    final_audit:
      require_every_nonempty_expected_connection: true
      require_every_empty_expected_connection_absent: true
      prohibit_unexplained_connections: true
      require_exact_effective_allow_set: true
  signal_structure_handoff:
    provisional_tll_is_review_input_only: true
    prohibit_provisional_tll_as_final_input: true
    permission_materializer_does_not_finalize_tls: true
    review_occurs_after_final_connection_set: true
    reviewed_connections: governed_reviewed.con.xml
    reviewed_traffic_lights: governed_reviewed.tll.xml
    require_total_connection_to_tls_link_mapping: true
    require_phase_state_length_equal_controlled_link_count: true
    connection_change_after_review_policy: invalidate_tls_review_and_stop
    tls_connection_assignment_location: tllogic_file_connection_elements
    pinned_tllogic_xsd: /usr/share/sumo/data/xsd/tllogic_file.xsd
  final_conversion:
    requires_permission_fixture_passed: true
    requires_signal_structure_review_passed: true
    inputs:
      node-files: governed_provisional.nod.xml
      edge-files: governed_permissions.edg.xml
      connection-files: governed_reviewed.con.xml
      tllogic-files: governed_reviewed.tll.xml
  fixture_acceptance:
    xsd_validation_required:
      edges: /usr/share/sumo/data/xsd/edges_file.xsd
      connections: /usr/share/sumo/data/xsd/connections_file.xsd
      traffic_lights: /usr/share/sumo/data/xsd/tllogic_file.xsd
    pinned_final_netconvert_exit_code: 0
    pinned_sumo_network_load_required: true
    exact_lane_permission_match_required: true
    exact_connection_permission_match_required: true
    zero_unmapped_lanes_required: true
    zero_unmapped_connections_required: true
    zero_unclassified_warnings_required: true
  deterministic_serialization:
    encoding: UTF-8
    xml_declaration: required
    newline: LF
    generator_timestamp_comment: prohibited
    retained_element_order: source_order
    lane_order: numeric_index_ascending
    vclass_order: lexicographic
    atomic_write: true
    overwrite_existing_output: false
  output_artifacts:
    audit_schema: reproducibility/config/traffic_simulation/schemas/permission_materialization_audit.schema.json
    summary_schema: reproducibility/config/traffic_simulation/schemas/materialization_summary.schema.json
    failure_schema: reproducibility/config/traffic_simulation/schemas/failure_report.schema.json

vehicle_input_policy:
  allowed_vclasses:
    - passenger
    - taxi
    - bus
    - coach
    - delivery
    - truck
    - motorcycle
    - moped
  forbidden_vclasses:
    - ignoring
    - custom1
    - custom2
    - evehicle
  inspect_elements:
    - vType
    - vehicle
    - flow
    - trip
  reject_ungoverned_vclass: true
  validate_referenced_vtype: true
  ev_delivery_representation:
    road_vclass: delivery
    powertrain_model: sumo_battery_device
    evehicle_vclass_allowed: false
    rationale: vClass governs road permissions while the battery device governs electric powertrain behavior

design_decision_assessment:
  impact_ranking_before_sensitivity: prohibited
  items:
    priority:
      category: design_choice_with_regional_validity_limit
      source: sumo_1_24_0_osmNetconvert_typemap
      regional_validity: not_empirically_calibrated_for_tokyo
      primary_effects:
        - junction_right_of_way
        - stops
        - delay
        - realized_travel_time
      does_not_directly_change_static_route_cost_when_priority_factor_is_zero: true
    road_type_whitelist:
      category: research_scope_design_choice
      primary_effects:
        - network_connectivity
        - reachable_customers
        - route
        - distance
    vclass_permissions:
      category: vehicle_access_design_choice
      primary_effects:
        - reachable_edges_by_vclass
        - reachable_customers_by_vclass
        - route
        - distance
    dedicated_bus_links:
      category: network_representation_design_choice
      delivery_access_allowed: false
      primary_effects:
        - background_bus_network
        - prohibited_delivery_entry
    typemap_attribute_omission:
      category: evidence_governance_design_choice
      rationale: require an adopted value and provenance instead of an unrecorded typemap value
    incomplete_pre_and_post_validators:
      category: implementation_and_quality_assurance_risk
      severity: high
      blocks_formal_build: true
    governance_fixture_values:
      category: synthetic_test_input
      representative_of_tokyo: false
      isolated_from_formal_experiments: true
      assessment: fit_for_behavioral_testing_only

design_sensitivity:
  status: factors_preregistered_execution_pending
  prohibit_post_hoc_condition_selection: true
  thresholds:
    status: pending_preregistration_with_rationale
    do_not_infer_small_effect_from_unspecified_threshold: true
  effect_size:
    primary: relative_change_from_baseline
    zero_baseline_policy: report_absolute_change_and_mark_relative_change_undefined
  factors:
    priority:
      baseline: sumo_1_24_0
      alternatives:
        - id: uniform_priority_1
          value_for_all_retained_types: 1
        - id: simplified_three_level_hierarchy
          values:
            "3":
              - highway.motorway
              - highway.motorway_link
              - highway.trunk
              - highway.trunk_link
              - highway.primary
              - highway.primary_link
            "2":
              - highway.secondary
              - highway.secondary_link
              - highway.tertiary
              - highway.tertiary_link
            "1":
              - highway.unclassified
              - highway.residential
              - highway.living_street
              - highway.service
              - highway.service|psv
              - highway.service|bus
              - highway.bus_guideway
              - highway.busway
      primary_metrics:
        - junction_waiting_time
        - stop_count
        - travel_time
        - delay
    service_permissions:
      baseline: governed_motorized_allow_set
      alternatives:
        - delivery_disallowed
      primary_metrics:
        - delivery_reachable_edge_count
        - reachable_customer_count
        - route_distance
    dedicated_bus_links:
      baseline: retained_for_bus_only
      alternatives:
        - excluded_from_network
      primary_metrics:
        - bus_reachable_edge_count
        - delivery_entry_violation_count
        - connected_component_count
    track_inclusion:
      baseline: excluded
      alternatives:
        - retain_only_with_explicit_governed_motor_vehicle_evidence
      primary_metrics:
        - connected_component_count
        - reachable_customer_count
        - route_distance
    unresolved_attributes:
      baseline: stop_before_netconvert
      alternatives:
        - structural_profile_only_explicit_placeholder
      primary_metrics:
        - fallback_intrusion_count
        - direction_difference_count
        - capacity_difference
        - travel_time_difference

attribute_resolution:
  governed_attributes:
    - lanes
    - maxspeed
    - oneway
    - access
    - turn_restrictions
  preserve_osm_turn_restrictions: true
  record_unconverted_turn_restrictions: true
  manual_override_requires:
    - osm_id
    - source
    - reason
    - reviewer
    - reviewed_at
  derived_validated_model_requires:
    - model_id
    - model_version
    - training_population
    - validation_population
    - validation_metrics
    - acceptance_rule
    - validation_record
  value_states:
    - observed
    - authoritative_external
    - explicit_osm
    - derived_osm_rule
    - reviewed_manual
    - approved_assumption
    - derived_validated_model
    - structural_placeholder
    - missing
    - valid_but_unsupported
    - conditional
    - directionally_asymmetric
    - unresolved
    - conflict
    - invalid
  missing_attribute_policy:
    name: report_then_gate_by_criticality
    inspect_after_vehicle_scope_filter: true
    record_all_missing_values: true
    record_all_derived_values: true
    record_all_supplemented_values: true
    record_all_unresolved_values: true
    record_all_conflicts: true
    record_all_invalid_values: true
    allow_silent_sumo_defaults: false
    allow_silent_typemap_defaults: false
    pre_netconvert_materialization_gate:
      required_for_every_retained_way:
        - lanes
        - maxspeed
        - oneway
      required_provenance_fields:
        - adopted_value
        - value_state
        - source_registry_id
        - derivation_method
      reject_states:
        - unresolved
        - conflict
        - invalid
        - missing
        - valid_but_unsupported
        - conditional
        - directionally_asymmetric
      list_structural_placeholders_separately: true
    report_path: 03_data/processed/traffic_simulation/validation/ota_ward_20260716_road_attribute_audit.csv
    report_fields:
      - osm_way_id
      - highway
      - name
      - attribute
      - source_value
      - adopted_value
      - value_state
      - source_registry_id
      - derivation_method
      - reference_date
      - match_status
      - match_confidence
      - criticality
      - decision
      - reviewer
      - reviewed_at
    profiles:
      structural:
        allow_noncritical_structural_placeholder: true
        allow_low_confidence_external_value: false
        research_results_allowed: false
      formal:
        allow_structural_placeholder: false
        allow_derived_validated_model: true
        require_validation_record_for_derived_model: true
        require_zero_states_on_critical_roads:
          - unresolved
          - conflict
          - invalid
          - missing
          - valid_but_unsupported
          - conditional
          - directionally_asymmetric
        require_human_review_for_low_confidence_critical_matches: true
        require_sensitivity_for_critical_approved_assumptions: true
  fallback_types: {}

network_profiles:
  structural:
    purpose: connectivity_visualization_smoke_and_provisional_routing
    output_subdirectory: structural
    research_results_allowed: false
    allowed_uses:
      - topology_validation
      - connectivity_validation
      - permission_validation
      - visualization
    prohibited_uses:
      - travel_time_evaluation
      - capacity_evaluation
      - delivery_performance
      - classical_qaoa_comparison
  formal:
    purpose: calibration_validation_delivery_and_classical_qaoa_experiments
    output_subdirectory: formal
