attribute_rules:
  oneway:
    check_order:
      - explicit_osm
      - implied_osm_rule
      - public_regulation
      - verified_public_regulation_source
    explicit_yes: materialize_yes
    explicit_no: materialize_no
    explicit_reverse: valid_but_unsupported_stop_until_directional_tag_safe_transform
    roundabout_without_explicit_value: derived_yes_osm_rule
    motorway_without_explicit_value: derived_yes_osm_rule
    motorway_link_without_explicit_value: unresolved
    ordinary_road_without_oneway_tag: derived_bidirectional_osm_rule
    materialize_derived_bidirectional_as: "no"
    statistical_placeholder_allowed: false
    conflict_policy: stop
    absent_typemap_value_may_fallback_to: oneway_true
    require_materialized_value_before_netconvert: true
  lanes:
    check_order:
      - osm_directional_lane_tags
      - osm_lanes
      - road_traffic_census
      - road_ledger
      - scoped_aerial_imagery_review
      - noncritical_structural_placeholder
    validate_consistency_with:
      - lanes_forward
      - lanes_backward
      - lanes_both_ways
      - oneway
  maxspeed:
    check_order:
      - explicit_osm
      - directional_osm
      - conditional_osm
      - jartic_traffic_regulations
      - other_public_authority_source
      - dated_legal_derivation
    reject_conditional_or_multiple_value_without_review: true
    legal_derivation_requires:
