      - reviewer
      - reviewed_at
      - references
    allowed_decisions:
      - accept
      - reject
    inspect:
      - distance
      - connected_roads
      - traffic_signals
      - bridge
      - tunnel
      - divided_carriageway
  formal_conversion:
    automatic_join: false
    require_reviewed_node_file: true
    reviewed_node_file: reproducibility/config/traffic_simulation/ota_ward_junction_joins.nod.xml
    require_one_to_one_review_mapping: true
    reject_unreviewed_joins: true

netconvert:
  common_options:
    lefthand: true
    keep-edges.by-vclass:
      - passenger
      - taxi
      - bus
      - coach
      - delivery
      - truck
      - motorcycle
      - moped
    output.original-names: true
    write-license: true
    geometry.remove: false
    no-internal-links: false
    ramps.guess: false
    roundabouts.guess: false
    no-turnarounds.except-deadend: true
    remove-edges.isolated: false
    tls.guess: false
    tls.guess-signals: true
    tls.discard-simple: true
    tls.join: false
    tls.default-type: static
    ignore-errors: false
    ignore-errors.connections: false
    ignore-errors.edge-type: false
    xml-validation: local
    xml-validation.net: local
    osm.lane-access: true
    osm.annotate-defaults: true
  candidate_generation_overrides:
    junctions.join: true
    junctions.join-dist: 10.0
    junctions.join-output: 03_data/processed/traffic_simulation/road_network/sumo/common/ota_ward_20260716_junction_join_candidates.xml
  formal_conversion_options:
    junctions.join: false
    geometry.remove: false
    tls.guess: false
    tls.guess-signals: false
    tls.discard-simple: false
    node-files: reproducibility/config/traffic_simulation/ota_ward_junction_joins.nod.xml

routing:
  baseline_objective: travel_time
  common_options:
    weights.priority-factor: 0.0
  priority_policy:
    direct_priority_penalty_in_static_route_choice: false
    expected_direct_effects:
      - none_when_priority_factor_is_zero
    expected_simulation_effects:
      - junction_right_of_way
      - waiting_time
      - stops
      - realized_travel_time
    rerouting_with_realized_travel_times_may_change_routes_indirectly: true

traffic_lights:
  source_priority:
    - explicit_osm_signal_information
    - sumo_structural_initialization
  generated_program_is_observed_timing: false
  observed_timing_calibration_stage: signal_vehicle_driver_configuration
  structure:
    includes_signalized_junction_selection: true
    includes_connection_to_tls_link_mapping: true
    must_be_fixed_before_formal_network: true
    change_invalidates_calibration_and_validation: true
  timing:
    includes_cycle_phase_split_and_offset: true
    calibrated_after_demand_input: true

geometry_and_connectivity:
  preserve_internal_links: true
  preserve_original_osm_ids: true
  infer_additional_ramps: false
  infer_additional_roundabouts: false
  turnarounds: deadends_only
  automatically_remove_isolated_edges: false
  report_connected_components: true
  provenance_relation:
    cardinality: osm_way_to_many_sumo_edges_to_many_sumo_lanes
    require_original_osm_name_output: true
    require_every_lane_traceable_to_osm_or_explicit_generation_rule: true
    unmapped_lane_policy: stop

network_stage_order:
  required_sequence:
    - structural_network
    - structural_debug
    - governed_attributes_and_lane_permissions
    - provisional_connections
    - connection_permissions_and_final_connection_set
    - signal_junction_and_tls_link_review
    - formal_baseline_network
    - demand_inputs
    - signal_timing_calibration
    - calibration
    - independent_validation
    - delivery_classical_qaoa_evaluation
  calibration_requires_formal_network: true
  demand_simulation_requires_formal_network: true
  structural_placeholders_must_be_zero_before_calibration: true
  changing_formal_network_invalidates_downstream_calibration: true
  changing_signal_junction_or_link_structure_is_formal_network_change: true

structural_quality_gate:
  threshold_status: pending_preregistration_with_rationale
  result_blind_threshold_selection_required: true
  metrics:
    retained_osm_way_rate:
      denominator: governed_osm_ways
      numerator: governed_osm_ways_with_explained_sumo_output_or_approved_discard
      report_units:
        - way_count
        - way_length_m
    major_road_reachability_rate:
      unit: preregistered_major_road_pair
    largest_component_drivable_length_share:
      weight: drivable_edge_length_m
    direction_mismatch_count:
      comparison: expected_osm_direction_vs_generated_sumo_edges
    representative_od_route_success_rate:
      od_set: preregistered_depot_customer_charger_pairs
      evaluate_by_vclass_and_direction: true
    sumo_load_status:
      required_exit_code: 0
      require_xml_validation_success: true
    warning_counts:
      classes:
        - fatal
        - approved
        - informational
      unclassified_warning_policy: stop
  vclass_directional_evaluation:
    vclasses:
      - delivery
      - truck
      - passenger
      - taxi
      - bus
      - coach
      - motorcycle
      - moped
    directed_reachability_required: true
    depot_to_all_customers_and_chargers_required: true
    all_customers_and_chargers_to_depot_return_required: true
  formal_promotion_requires_all_thresholds_registered: true

formal_candidate_subgraph:
  review_scope: all_edges_selectable_by_any_compared_algorithm
  terminals:
    - depots
    - all_customers
    - charging_facilities
  include_all_reachable_edges_between_terminals: true
  include_preregistered_alternative_route_buffer: true
  final_selected_routes_only_is_prohibited: true

traffic_observation_policy:
  acquisition_runs_in_parallel_with_network_pipeline: true
  time_limited_sources:
    - jartic_5_minute
    - jartic_1_hour
  periodic_snapshot_automation_status: pending
  temporal_alignment:
    same_date_and_time_window_preferred: true
    mixed_time_observations_require_adjustment_and_uncertainty_record: true
    required_context:
      - weekday_or_holiday
      - weather
      - incidents
      - roadworks
      - school_holiday_period
      - special_events
      - sensor_missingness
      - traffic_regulations

calibration_policy:
  prerequisite_network_profile: formal
  prohibit_structural_placeholder: true
  stage_order:
    - fix_network_lanes_and_signal_structure
    - fit_observable_demand
    - fit_capacity_and_saturation_flow
    - fit_route_choice
    - fit_travel_time_speed_and_queue
    - local_parameter_refinement
  simultaneous_free_calibration_of_all_parameter_groups: false
  parameter_registry_required_fields:
    - parameter
    - initial_value
    - search_range
    - evidence
    - objective_metric
    - fixed_conditions
    - stopping_rule
  metric_threshold_status: pending_preregistration_with_rationale
  result_blind_threshold_selection_required: true
  stochastic_evaluation:
    multiple_seeds_required: true
    seed_set_status: pending_variance_based_design
    replication_count_method: output_variance_and_required_confidence_interval
    warmup_period_required: true
    warmup_rule_status: pending_preregistration
    common_random_numbers_for_comparisons: true
  seed_registry:
    shared_environment_seeds:
      - instance_seed
      - demand_generation_seed
      - traffic_simulation_seed
    algorithm_specific_seed_sets:
      - classical_solver_seed
      - qaoa_parameter_seed
      - qaoa_sampling_seed
    same_integer_across_algorithm_specific_seeds_has_no_equivalence_claim: true
  changing_network_or_demand_definition_invalidates_calibration: true

failure_policy:
  fail_fast: true
  allow_unknown_cli_options: false
  allow_runtime_option_overrides: false
  allow_arbitrary_input_path: false
  allow_arbitrary_bbox: false
  allow_absolute_host_paths: false
  overwrite_outputs: false
  abort_on_any_missing_osm_attribute: false
  abort_on_unmaterialized_governed_attribute: true
  abort_on_forbidden_or_ungoverned_vclass: true
  abort_on_generated_permission_exceeding_typemap: true
  abort_on_unapproved_default_derived_value: true
  netconvert_log_audit:
    fatal_patterns:
      - Unknown type
      - Unknown compound type
      - Discarding unknown compound
      - Could not add edge
    reconcile_or_fail_patterns:
      - Discarding edge
    warning_classes:
      fatal: explicit_fatal_patterns
      approved: versioned_approval_registry_with_reason
      informational: versioned_information_registry
    unclassified_warning_policy: stop
    explicit_typemap_discards_are_reportable_not_fatal: true
    fail_on_unreconciled_exclusion: true
  abort_on_invalid_attribute: true
  abort_on_attribute_conflict: true
  abort_on_direction_resolution_failure: true
  abort_on_unsourced_manual_value: true
  abort_formal_on_unresolved_critical_attribute: true
  abort_formal_on_low_confidence_critical_match: true
  abort_formal_on_structural_placeholder: true
  pre_netconvert_formal_zero_counts:
    - unresolved_oneway
    - unresolved_lanes
    - unresolved_maxspeed
    - unresolved_access
    - access_conflicts
    - invalid_lane_counts
    - unknown_conditional_rules
  post_netconvert_zero_counts:
    - unmanaged_vclasses
    - unexpected_oneway_edges
    - unexpected_reverse_edges
    - lane_count_mismatches
    - speed_mismatches
    - permission_mismatches
    - untracked_edges
    - unmapped_lanes
    - unmapped_connections
    - unexpected_connections
    - missing_expected_connections
    - tls_link_mapping_mismatches
    - tls_phase_state_length_mismatches
    - unclassified_warnings
    - unreconciled_removed_edges

artifact_retention:
  large_generated_artifacts:
    git_tracked: false
    examples:
      - normalized_osm_xml
      - net_xml
  small_reproducibility_artifacts:
    immutable_versioning_required: true
    storage: git_or_content_addressed_immutable_artifact_store
    required:
      - netccfg
      - build_manifest_json
      - build_summary_json
      - warning_classification_json
      - artifact_checksums_txt
  git_index_required_if_external_storage_used: true

reference_evidence:
  priority_order:
    - pinned_sumo_1_24_0_runtime_fixture
    - sumo_v1_24_0_source_or_xsd
    - dated_hashed_official_document_snapshot
    - current_official_documentation
  current_documentation_url_alone_is_not_version_pinned_evidence: true

test_execution_evidence:
  required_fields:
    - git_commit
    - container_digest
    - exact_command
    - test_collection_hash
    - exit_code
    - log_sha256
    - started_at
    - finished_at

provenance:
  distinguish_value_classes:
    - observed
    - authoritative_external
    - explicit_osm
    - derived_osm_rule
    - reviewed_manual
    - approved_assumption
    - derived_validated_model
    - structural_placeholder
    - missing
    - valid_but_unsupported
    - conditional
    - directionally_asymmetric
    - unresolved
    - conflict
    - invalid
  record:
    - input_sha256
    - intermediate_osm_xml_sha256
    - config_sha256
    - typemap_sha256
    - junction_review_sha256
    - reviewed_node_file_sha256
    - tool_versions
    - sumo_image_digest
    - generated_commands
    - warnings
    - excluded_roads
    - unconverted_restrictions
    - road_attribute_audit
    - external_match_audit
    - pre_and_post_critical_roads
    - structural_placeholder_usage
    - structural_counts
    - connected_components
  update_rule: increment_config_version_and_do_not_mix_outputs
