direction_model:
  representation: directed_segment
  id_template: 'ds:{source_way_id}:{source_start_index}:{source_end_index}:{source_direction}'
  source_directions: [forward, backward]
  preserve_source_way: true
  allow_source_way_reversal: false
  formal_direction_evidence: exact_source_node_lineage
  oneway_generation:
    'yes': [forward]
    'no': [forward, backward]
    '-1': [backward]
lane_resolution:
  resolver_lane_order: left_to_right_in_travel_direction
  sumo_lane_index_formula: n - 1 - p
  formal_even_split_allowed: false
  structural_assumption_ids: [BIDIRECTIONAL_EVEN_LANE_EQUAL_SPLIT_V1]
access_resolution:
  target_scope_dimensions: [direction, lane]
  specificity_axes: [spatial, vehicle, temporal, purpose]
  comparison: set_inclusion_pareto
  independent_source_order_tiebreak: false
  conflicting_maximal_rules: ACCESS_SPECIFICITY_CONFLICT
permissions:
  formal_authority: resolver_expected_permissions
  typemap_role: provisional_topology_candidate
  governed_vclasses: [passenger, taxi, bus, coach, delivery, truck, motorcycle]
  patch_generated_net_xml: false
attribute_resolution_acceptance:
  require_complete: true
  maximum_blockers: 0
  maximum_review_required: 0
  maximum_stop_unresolved: 0
  maximum_model_assumed: 0
  require_schema_validation: true
  require_semantic_validation: true
  require_oracle_validation: true
  require_classification_projection_invariance: true
  require_two_run_determinism: true
outputs:
  structural: reproducibility/outputs/traffic_simulation/attribute_resolution_v17/structural
  formal: reproducibility/outputs/traffic_simulation/attribute_resolution_v17/formal
  overwrite_existing: false
