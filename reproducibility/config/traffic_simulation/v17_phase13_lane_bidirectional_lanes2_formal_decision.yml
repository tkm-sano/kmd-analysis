decision_method:
  general_principle: >-
    If an approved formal semantic already exists and runtime is merely missing
    a connection, treat the change as a conformance fix. If a structural,
    heuristic, or model-assumed interpretation is promoted to formal
    rule-derived behavior, create a separate semantic decision.
  usual_method_for_this_case: new_independent_decision
  selected_method: new_independent_decision
  rejected_method: conformance_fix_or_structural_rule_copy
  rationale: >-
    Existing v17 policy permits BIDIRECTIONAL_EVEN_LANE_EQUAL_SPLIT_V1 only as
    structural model_assumed behavior and explicitly prohibits formal equal
    split from total lanes alone. Approving a narrow lanes=2 interpretation as
    rule_derived therefore adds a new formal value semantics boundary rather
    than wiring already-approved runtime behavior.

responsibility_boundary:
  existing_structural_rule:
    rule_id: BIDIRECTIONAL_EVEN_LANE_EQUAL_SPLIT_V1
    owns:
      - structural_profile_even_total_split_for_shape_and_connectivity_review
      - value_origin_model_assumed
      - formal_eligible_false
  this_decision_owns:
    - project_level_formal_interpretation_for_bidirectional_total_lanes_2_only
    - forward_moving_lanes_1_and_backward_moving_lanes_1
    - value_origin_rule_derived
    - source_lane_tag_preservation
  explicitly_out_of_scope:
    - lanes_4_or_higher_even_totals
    - odd_or_single_lane_totals
    - absent_lane_counts
    - one_way_lane_count_missing
    - lanes_both_ways_materialization
    - reversible_or_alternating_lanes
    - arithmetic_complement_generalization
    - SUMO_default_numLanes_as_formal_evidence
    - Way_specific_exceptions

