primary_authority_evidence:
  osm_key_lanes:
    authority: OpenStreetMap Wiki
    url: https://wiki.openstreetmap.org/wiki/Key:lanes
    relevant_claims:
      - lanes is a total moving-lane count for motorized traffic
      - lanes:forward and lanes:backward express uneven two-way distribution
      - lanes:both_ways covers lanes usable in both directions
      - lanes can be incomplete or misused by mappers, so OSM-general certainty is not claimed
      - examples include two-way lanes=2 as one lane in each direction
  osm_japanese_lanes_guidance:
    authority: OpenStreetMap Wiki
    url: https://wiki.openstreetmap.org/wiki/JA:Key:lanes
    relevant_claims:
      - Japanese page mirrors the total-lane tagging concept for roads
  osm_lanes_suffix:
    authority: OpenStreetMap Wiki
    url: https://wiki.openstreetmap.org/wiki/Key:*:lanes
    relevant_claims:
      - lane vectors use pipe-separated lane entries
      - forward and backward suffixes are needed on non-oneway roads when lane properties differ by direction
  sumo_plainxml:
    authority: SUMO documentation
    url: https://sumo.dlr.de/docs/Networks/PlainXML.html
    relevant_claims:
      - plain SUMO edges are unidirectional and carry numLanes
      - omitted numLanes has a default, but this decision does not use that default as evidence
  sumo_network_lanes:
    authority: SUMO documentation
    url: https://sumo.dlr.de/docs/Networks/SUMO_Road_Networks.html
    relevant_claims:
      - lanes belong to a directed edge and lane index zero is the rightmost lane

decision:
  result: approved_limited_formal_rule_derived_lane_allocation
  rule_id: OSM_BIDIRECTIONAL_TOTAL_2_TO_ONE_ONE_V1
  applicability:
    canonical_oneway: 'no'
    lanes: 2
    lanes_forward: absent
    lanes_backward: absent
    lanes_both_ways: absent
    lane_conditional: absent
    reversible_or_alternating: absent
  project_level_semantics:
    value_origin: rule_derived
    source_preservation: true
    forward_moving_lanes: 1
    backward_moving_lanes: 1
    both_ways_moving_lanes: 0
    total_moving_lanes: 2
  osm_general_semantics_boundary: >-
    This decision does not assert that every OSM lanes=2 is universally and
    physically guaranteed to be exactly 1+1. It adopts a project-level formal
    interpretation only for the fixed v17 population and guard conditions.
  arithmetic_complement:
    general_unlock: false
    lanes_4_or_higher: excluded
    partial_directional_counts: excluded

