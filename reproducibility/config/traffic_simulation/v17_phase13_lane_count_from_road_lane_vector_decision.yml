decision_method:
  general_principle: >-
    Reuse an existing decision only when it already owns the same semantics.
    Create an independent decision when a new source-evidence-to-derived-value
    interpretation is introduced, while reusing existing fail-closed conflict
    semantics.
  usual_method_for_this_case: new_independent_decision
  selected_method: new_independent_decision
  rejected_method: amend_DEC-P13-LANE-BIDIRECTIONAL-TOTAL-2-FORMAL-001
  rationale: >-
    The L2 decision owns allocation of explicit bidirectional lanes=2 as 1+1.
    This decision derives a missing one-way lane count from approved road-lane
    vector field counts. The evidence source and semantic responsibility are
    different, and the L2 decision explicitly excludes absent lane counts and
    one-way lane-count-missing cases.

responsibility_boundary:
  existing_L2_decision:
    decision_id: DEC-P13-LANE-BIDIRECTIONAL-TOTAL-2-FORMAL-001
    owns:
      - explicit_bidirectional_total_lanes_2
      - forward_1_backward_1_allocation
    does_not_own:
      - absent_lane_count_derivation
      - one_way_road_lane_vector_count_semantics
  existing_conflict_policy:
    owns:
      - explicit_lane_count_vs_vector_length_mismatch
      - LANE_VECTOR_LENGTH_MISMATCH
      - fail_closed_without_majority_or_precedence
  this_decision_owns:
    - approved_one_way_road_lane_vector_key_scope
    - consistent_pipe_field_count_to_active_direction_lane_count
    - value_origin_rule_derived
    - source_vector_preservation
  explicitly_out_of_scope:
    - general_star_lanes_inference
    - cycleway_lanes
    - bicycle_specific_lanes
    - bus_specific_lanes
    - access_specific_lanes
    - unknown_lane_vector_families
    - bidirectional_lane_count_derivation
    - width_or_est_width_inference
    - SUMO_numLanes_default
    - conditional_reversible_or_alternating_lanes
    - Way_specific_exceptions

