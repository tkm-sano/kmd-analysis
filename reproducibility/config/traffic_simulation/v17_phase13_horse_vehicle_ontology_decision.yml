acceptance_requirements_for_implementation:
  - horse=no and horse=yes both normalize with an empty governed vehicle domain
  - adding or removing horse=no or horse=yes does not change the managed delivery permission result
  - applicable access and motorized-specific rules produce identical delivery results before and after horse normalization
  - all 130 fixed horse records retain Way ID, source key, source value and blocker lineage
  - the two motorcar-and-horse co-occurrence Ways retain both source constraints
  - unknown vehicle keys and out-of-scope horse syntax remain fail-closed
  - focused tests and the fixed-container full regression pass
  - a new full-population probe reproduces zero remaining horse hierarchy blockers without modifying Phase 12 publication
