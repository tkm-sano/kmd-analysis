formal_reasoning:
  symbols:
    governed_motorized_universe: G
    horse_rider_domain: H
    managed_delivery_domain: D
  sets:
    G: [passenger, taxi, bus, coach, delivery, truck, motorcycle]
    H: []
    D: [delivery]
  propositions:
    - H_intersection_G_is_empty
    - H_intersection_D_is_empty
    - horse_specific_rule_is_not_applicable_to_delivery_tuple
    - non_applicability_does_not_imply_road_permission
    - delivery_permission_remains_determined_by_applicable_parent_and_motorized_specific_rules

decision:
  result: approved_empty_intersection
  rule_id: NON_GOVERNED_HORSE_RIDER_DOMAIN_EMPTY_INTERSECTION_V1
  source_key: horse
  approved_source_values: ['no', 'yes']
  registered_vehicle_domain: []
  permission_effect_on_governed_vclasses: none
  permission_effect_on_managed_delivery: none
  source_record_preserved: true
  formal_exclusion: false
  blocker_resolution_mechanism: registered_non_applicable_vehicle_domain
  rationale: >-
    OSM horse=* governs equestrians, while the research universe contains only
    motorized SUMO vClasses and the managed vehicle is a battery-electric delivery
    vehicle. Therefore horse=no and horse=yes constrain a disjoint mode and cannot
    allow or deny the managed delivery tuple.

mandatory_boundaries:
  - access, vehicle, motor_vehicle, motorcar, goods, hgv, delivery and other applicable rules remain effective
  - horse=yes cannot override access=no or a motorized denial for a delivery vehicle
  - horse=no cannot deny a delivery vehicle that is otherwise allowed
  - the horse source tag and provenance must remain in the resolved record
  - the record remains governed and must not be moved to the exclusion population
  - carriage is not horse and is outside this decision
  - horse-drawn vehicles are not classified by this decision
  - values other than no and yes require a separate registered decision before formal use
  - conditional, directional or lane-scoped horse syntax requires separate syntax validation
  - an unregistered vehicle key continues to stop fail-closed with ACCESS_VEHICLE_HIERARCHY_MISSING

