osm_authority_evidence:
  - evidence_id: OSM-HORSE-KEY-REV-3060819
    title: OpenStreetMap Wiki Key:horse
    url: https://wiki.openstreetmap.org/w/index.php?title=Key:horse&oldid=3060819
    accessed_at: '2026-08-14'
    relevant_claims:
      - horse is the access-permission key for equestrians riding on horseback
      - horse is not a member of the OSM vehicle branch
      - horse and carriage are non-overlapping access categories
      - horse is a legal access restriction and not a suitability rating
  - evidence_id: OSM-ACCESS-HIERARCHY-REV-3054035
    title: OpenStreetMap Wiki Key:access transport-mode hierarchy
    url: https://wiki.openstreetmap.org/w/index.php?title=Key:access&oldid=3054035
    accessed_at: '2026-08-14'
    relevant_claims:
      - horse is listed in the without-a-vehicle branch
      - vehicle is a separate branch and motor_vehicle is below the vehicle branch
      - a specific transport-mode key overrides its parent only for that mode
      - access remains the common parent applying to all land-based modes

