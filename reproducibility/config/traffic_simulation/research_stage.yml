schema_version: 2
updated_at: "2026-09-11"
current_stage_id: demand_and_observations
current_summary_ja: 正式道路網とRouting Baselineは受入済み。full-EVRP本線では需要・顧客・TW等の定義が未完である一方、独立したreduced route-ordering branchはR21/R22 PASS、R23 Reduced Problem baseline ACCEPTED_WITH_LIMITATIONS
readiness:
  - id: specification
    label_ja: 道路網仕様
    status: accepted
    status_label_ja: 受入済み
    note_ja: V18 geometry/length re-acceptanceとR12-R14 Routing Baseline validationがPASS。旧v16停止記録は履歴であり現行network gateではない
  - id: formal_network
    label_ja: 正式SUMO道路網
    status: accepted
    status_label_ja: 受入済み
    note_ja: current V18 authorityでFORMAL_NETWORK_ACCEPTED=true。accepted scopeとhashはEVRP_EXECUTION_PLAN.mdを正本とする
  - id: downstream_experiment
    label_ja: 下流実験
    status: scope_split
    status_label_ja: scope別
    note_ja: full-EVRP比較は未準備。R23既存n5 evidenceはACCEPTED_WITH_LIMITATIONSで保持。独立code auditはCODE_AUDIT_FAIL / CODE_AUDIT_RESULT_NOT_REPRODUCED、REMEDIATION_INCOMPLETE（I03残存）。rank02/03はexecution/resource provenance制約付きで未再承認
blockers:
  - full-EVRP本線ではR05-R11のcustomer sampling、demand、time window、service time、depot、EV、charging station定義が未完了
  - full-EVRP R20はcapacity、time window、battery/SOC、charging、fleet、一般reachabilityを含むaccepted QUBOがなくBLOCKED
  - reduced R23はroute recovery 3/3、optimizer reported success 2/3。rank01 success=false、cap reached。runtime benchmark PRELIMINARY_ONLY、n≥6非推奨。R24はNOT_AUTHORIZED_PENDING_R23_REMEDIATION
  - Aer結果を量子実機性能またはquantum advantageへ一般化できない
next_actions:
  - EVRP_EXECUTION_PLAN.mdに従いfull-EVRP本線の未完Definition stageを進める
  - R23 I03残存6箇所の無条件PASSを修正・検証する。remediation完了後は別task R23_N5_RUNTIME_OPTIMIZATION_CODE_AUDIT_POST_REMEDIATION_RERUN。独立PASS後のみphase closureとR24を検討する
  - R23 pilotとformal baselineを分離し、R22 Hamiltonianとlambdaを変更しない
  - full-EVRP/Hayate評価とreduced method evidenceをscope付きで統合する
