  - permission materializerが未実装で、SUMO 1.24.0固定fixtureも未実行
  - formal属性証拠、ジャンクション・TLSレビュー、prepare/validateパイプライン、事後監査が未完了
next_actions:
  - 属性別criticalityのschema・classifierとsynthetic fixtureを実装するが、実データ分類は次版closure受理まで公開しない
  - type=restriction:bus 3件を次版のrelation closure・Resolver対象へ含め、参照完全性とturn restriction保持をfixtureで検証する
  - 次版closureの候補母集団を受理してから、全way・属性・profileの実データcriticalityを新しい入力hashから生成する
  - 307件を排他的に登録した決定表について、優先度順に規則と独立fixtureを実装し、未実装項目は停止状態を維持する
  - Resolver blocker解消と並行してpermission materializerを実装し、SUMO 1.24.0固定fixtureでlane・connection期待値を検証する
