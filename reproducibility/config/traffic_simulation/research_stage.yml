current_summary_ja: バス規制を含むv16母集団を受理し、v15属性例外307行の排他的分類を完了して、重要度Classifier・Resolverをv16入力へ接続する段階
readiness:
  - id: specification
    label_ja: 道路網仕様
    status: governed_draft
    status_label_ja: 統制済みドラフト
    note_ja: v16参照補完母集団とv15属性例外307行の排他的分類は検証済みだが、重要度Classifier・Resolverのv16移行と属性値blocker解消が未完了
  - id: formal_network
    label_ja: 正式SUMO道路網
    status: not_accepted
    status_label_ja: 未承認
    note_ja: permission materializerと実ネットワーク検証が未完了
  - id: downstream_experiment
    label_ja: 下流実験
    status: not_ready
    status_label_ja: 実行不可
    note_ja: 承認済みformalネットワークがないため、較正・配送・QAOA評価へ進まない
blockers:
  - 明示値、外部証拠、model値、代替値から属性値を決め、evidence・conflict・review・stop状態を記録するresolver stageが未実装である
  - permission 264行、車線・速度42行、oneway 1行の属性値解決規則・実装・固定試験が未完了である
  - Classifier・Resolverはv16の受理済み入力hashへ未接続で、全way・両属性・両profileの実行証拠がない
  - permission materializerが未実装で、SUMO 1.24.0固定fixtureも未実行
  - formal属性証拠、ジャンクション・TLSレビュー、prepare/validateパイプライン、事後監査が未完了
next_actions:
  - 値・evidence・review・stop状態を決めるresolver stageを実装し、既存の分類オブジェクトを変更せず統合成果物へ継承する
  - 受理済みv16 closureをClassifier・Resolver入力へ接続し、全way・属性・profileの実データcriticalityを新しい入力hashから生成する
  - 排他的分類済みの307件について、日本・東京の証拠条件を満たす値解決規則を優先度順に実装し、未解決項目は停止状態を維持する
  - Resolver blocker解消と並行してpermission materializerを実装し、SUMO 1.24.0固定fixtureでlane・connection期待値を検証する
