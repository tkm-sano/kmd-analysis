known_conflicts:
  - id: conflict.current_stage_timeline
    label_ja: 現在工程の時間差
    summary_ja: 旧YAMLはSUMO道路網、後発文書は交通較正・route generationを現在工程としている。
    resolution_status: unresolved
    classification: [stale_documentation, temporal_update_difference]
    evidence_refs: [ev.research_stage_legacy, ev.current_issues, ev.route_spec]
    resolution_condition_ja: 研究責任者がPortalのstage粒度と現在工程をreviewし、旧YAMLの扱いを承認する。

  - id: conflict.observation_mapping_completion
    label_ja: 観測mapping完了範囲の粒度差
    summary_ja: 管理文書・旧snapshotと、後発の観測artifact生成PASSED・validation NOT_RUN・研究未受理が異なる粒度で併存する。
    resolution_status: unresolved
    classification: [stale_documentation, temporal_update_difference, granularity_difference, acceptance_readiness_difference]
    evidence_refs: [ev.project_structure, ev.current_issues, ev.road_current, ev.final_traffic_observations, ev.observation_final_status]
    resolution_condition_ja: mapping処理完了と正式利用可能な観測入力を別node・gateとして承認する。

  - id: conflict.baseline_demand_documentation_lag
    label_ja: 合成需要文書と実装の時間差
    summary_ja: 仕様文書の生成前記述に対し、現在は生成コードとunit testが存在する。
    resolution_status: unresolved
    classification: [stale_documentation, temporal_update_difference]
    evidence_refs: [ev.baseline_demand_spec, ev.baseline_demand_config, ev.baseline_demand_impl, ev.baseline_demand_test, ev.baseline_demand_artifact, ev.baseline_demand_quality]
    resolution_condition_ja: 現行成果物をreviewし、文書の現在範囲とmethod statusを同期する。

  - id: conflict.metric_priority
    label_ja: 配送metricの主指標位置付け差
    summary_ja: READMEは配送需要充足率を主評価として示す一方、implementation_planはP_eqを主指標、完了率を補助指標としている。
    resolution_status: unresolved
    classification: [semantic_conflict]
    evidence_refs: [ev.research_overview, ev.metric_implementation_plan]
    resolution_condition_ja: 研究責任者が両metricの主指標・補助指標・派生metricとしての位置付けを承認する。
