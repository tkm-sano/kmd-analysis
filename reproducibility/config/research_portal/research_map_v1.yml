  - {id: delivery_fulfillment, name: Delivery Fulfillment, status: DIRECT_ANALYSIS, purpose: 本研究の直接分析境界となる配送評価指標, input: validated future simulation outcomes, output: fulfillment metric, x: 245, y: 78}
  - {id: unserved_delivery_demand, name: Unserved Delivery Demand, status: DEFINITION_DERIVED, purpose: 同一scopeの需要とfulfillmentから未充足部分を導出する, input: delivery fulfillment and governed demand, output: unserved demand signal, x: 475, y: 78}
  - {id: effective_delivery_capacity_requirement, name: Potential Effective Delivery-Capacity Requirement, status: EVIDENCE_SUPPORTED, purpose: 未充足workloadを潜在的な実効配送能力要件として解釈する, input: unserved demand and operating constraints, output: potential capacity requirement, x: 705, y: 78}
  - {id: fleet_expansion_replacement, name: Potential Need for Fleet Expansion / Replacement, status: SUPPORTED_WITH_CONDITIONS, purpose: 既存運用で能力要件を満たせない場合の対応候補を示す, input: potential effective capacity requirement, output: one possible downstream response, x: 960, y: 78}
