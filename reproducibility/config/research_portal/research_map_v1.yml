schema_version: 1
map_id: RESEARCH-MAP-V1
status: CURRENT
authority_pointer: reproducibility/config/traffic_simulation/current_network_completion_authority_v17.yml
overview_pointer: RESEARCH_OVERVIEW.md
research_question: 量子技術の発展が、移動技術を通じて都市社会・都市経済にどのような変化をもたらしうるか
interpretation_mode: future_scenario_analysis_not_direct_causal_proof
current_position:
  current_milestone: M1 Network Ready
  milestone_status: DONE
  current_stage: routing_baseline
  immediate_next_task: Define routing scope for delivery instances
conceptual_nodes:
  - {id: quantum, name: Quantum Technology, purpose: 計算技術の能力と制約をscenarioとして定義する, input: quantum capability assumptions, output: optimization capability envelope, x: 40, y: 90}
  - {id: mobility, name: Mobility / Logistics Capability, purpose: 配送・移動能力への技術影響を表現する, input: optimization capability envelope, output: mobility and logistics alternatives, x: 280, y: 90}
  - {id: planning, name: Planning / Policy, purpose: 都市計画・政策上の選択肢を評価する, input: evaluated logistics outcomes, output: planning and policy options, x: 520, y: 90}
  - {id: business, name: Business / Economic Activity, purpose: 事業・都市経済上の選択肢を解釈する, input: planning options and fulfillment outcomes, output: business and economic options, x: 760, y: 90}
  - {id: society, name: Urban Society / Urban Economy, purpose: 条件付きの将来像を解釈する, input: planning and business options, output: future society interpretation, x: 1000, y: 90}
conceptual_edges:
  - {from: quantum, to: mobility, relation: parameterizes}
  - {from: mobility, to: planning, relation: feeds into}
  - {from: planning, to: business, relation: feeds into}
  - {from: business, to: society, relation: interprets}
implementation_nodes:
  - {id: external_data, stage: upstream, name: External / Open Data, purpose: baseline inputsとprovenanceを固定する, input: governed external sources, output: versioned source inputs, x: 510, y: 20}
  - {id: baseline_demand, stage: upstream, name: Baseline Demand, purpose: 現在基準のparcel-equivalent需要を構築する, input: external/open data, output: baseline demand, x: 760, y: 120}
  - {id: future_demand_parameterization, stage: 5, name: Future Demand Parameterization, purpose: 社会・需要scenarioをbaselineから分離して定義する, input: baseline demand and scenario evidence, output: scenario-specific demand parameters, x: 920, y: 220}
  - {id: requests, stage: upstream, name: Requests, purpose: baselineまたはscenario需要を配送要求へ変換する, input: governed demand, output: delivery requests, x: 760, y: 320}
  - {id: stops, stage: upstream, name: Stops, purpose: Requestsを配送地点へ集約する, input: delivery requests, output: 39956 baseline stops, x: 760, y: 420}
  - {id: structural_network, stage: upstream, name: Structural Network, purpose: source道路表現を構築する, input: external/open road data, output: structural road network, x: 260, y: 120}
  - {id: formal_completion, stage: upstream, name: Formal Network Completion, purpose: Three-tier属性を完成する, input: structural road network, output: completed Formal Network, x: 260, y: 220}
  - {id: sumo_materialization, stage: upstream, name: SUMO Materialization, purpose: Formal NetworkをSUMOへ変換する, input: completed Formal Network, output: SUMO net.xml, x: 260, y: 320}
  - {id: network_validation, stage: upstream, name: Network Validation, purpose: lane・speed・permission・connectivityを検証する, input: SUMO net.xml, output: validated SUMO network, x: 260, y: 420}
  - {id: stop_mapping, stage: upstream, name: Stop Mapping, purpose: Stopsをdelivery-permitted edgeへ対応付ける, input: validated network and stops, output: mapped stops, x: 510, y: 520}
  - {id: routeability, stage: upstream, name: Routeability Validation, purpose: 配送経路成立性のacceptance sampleを検証する, input: mapped stops and network, output: routeability gate, x: 510, y: 620}
  - {id: formal_network_acceptance, stage: upstream, name: Formal Network Acceptance, purpose: networkを研究利用へ承認する, input: network and mapping validation, output: accepted network, x: 510, y: 720}
  - {id: routing_baseline, stage: 1, name: Stage 1 — Routing Baseline, purpose: delivery instanceに必要なrouting costを固定する, input: accepted network mapped stops requests depot and vehicle class, output: scoped validated routing costs, x: 510, y: 820}
  - {id: common_instance, stage: 2, name: Stage 2 — Common Delivery Instance, purpose: solver共通の配送問題を固定する, input: demand routing and vehicle constraints, output: validated comparison instance, x: 510, y: 920}
  - {id: classical_optimization, stage: 3, name: Stage 3 — Classical Optimization, purpose: 古典最適化baselineを確立する, input: accepted common instance, output: feasible classical solutions, x: 510, y: 1020}
  - {id: qubo_formulation, stage: 4A, name: Stage 4A — QUBO Formulation, purpose: Classical problemを等価なQUBOへ写像する, input: fixed formulation and common instance, output: QUBO and mapping contract, x: 320, y: 1120}
  - {id: qubo_validation, stage: 4B, name: Stage 4B — QUBO Validation, purpose: 小規模instanceでClassical optimumとの整合を確認する, input: QUBO and exact small-instance reference, output: equivalence evidence, x: 320, y: 1220}
  - {id: qaoa, stage: 4C, name: Stage 4C — QAOA, purpose: validated QUBOを量子最適化へ接続する, input: validated QUBO and execution assumptions, output: quantum candidate solutions, x: 320, y: 1320}
  - {id: quantum_comparison, stage: 4D, name: Stage 4D — Classical vs Quantum, purpose: 共通条件で品質・feasibility・runtime・resourceを比較する, input: classical and quantum results, output: comparison evidence, x: 510, y: 1420}
  - {id: technology_scenarios, stage: 5, name: Stage 5 — Technology Scenarios, purpose: vehicle battery routing optimization quantum capabilityを分離して定義する, input: scenario evidence, output: technology scenario configs, x: 760, y: 1220}
  - {id: demand_scenarios, stage: 5, name: Stage 5 — Social / Demand Scenarios, purpose: population delivery volume spatial demand changeを定義する, input: baseline demand and scenario evidence, output: demand scenario configs, x: 920, y: 1320}
  - {id: delivery_simulation, stage: 6, name: Stage 6 — Delivery Simulation, purpose: 計画とscenarioを交通・配送系で実行する, input: accepted plans network instances and scenarios, output: realized simulation outcomes, x: 510, y: 1520}
  - {id: fulfillment_evaluation, stage: 7, name: Stage 7 — Fulfillment Evaluation, purpose: 主指標と補助指標を評価する, input: validated simulation outcomes, output: fulfillment evidence, x: 510, y: 1620}
  - {id: planning_business_interpretation, stage: 8, name: Stage 8 — Planning / Business, purpose: 技術outputを条件付き政策・事業含意へ接続する, input: fulfillment and sensitivity evidence, output: planning and business interpretation, x: 510, y: 1720}
  - {id: future_society_interpretation, stage: 9, name: Stage 9 — Future Society, purpose: 都市社会・都市経済へのscenario含意を統合する, input: planning and business interpretation, output: bounded research conclusion, x: 510, y: 1820}
  - {id: sensitivity_robustness, stage: 10, name: Stage 10 — Sensitivity / Robustness, purpose: assumptionsと結論の頑健性を評価する, input: accepted stage outputs and parameter ranges, output: robustness evidence, x: 760, y: 1720}
  - {id: reproducibility_freeze, stage: 11, name: Stage 11 — Reproducibility / Freeze, purpose: authority・config・artifact・version・commandを固定する, input: all claimed accepted evidence, output: publication freeze, x: 510, y: 2020}
