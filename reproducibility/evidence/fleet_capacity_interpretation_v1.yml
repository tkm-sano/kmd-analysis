    conditions: [Vehicle availability, payload, route feasibility, usable battery range, charging time and availability, downtime, and working time determine effective capacity.]
    out_of_scope_claims: [Vehicle count is not treated as identical to effective delivery capacity., EVs are not assumed always to require more vehicles.]
  - id: fleet_expansion_replacement
    label: Potential Need for Fleet Expansion / Replacement
    layer: EVIDENCE_SUPPORTED_INTERPRETATION
    meaning: One possible capacity response when the required effective delivery capacity cannot be accommodated by the existing fleet and its operation.
