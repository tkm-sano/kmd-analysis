effective_capacity_conditions:
  - vehicle availability
  - payload
  - route feasibility
  - usable battery range
  - charging time
  - charging availability
  - vehicle downtime
  - working time

supports:
  - Delivery workload, demand, and operational requirements relate to fleet-capacity planning.
  - Unmet or unserved demand can be derived from delivery fulfillment under a consistent metric definition.
  - Insufficient effective delivery capacity may relate to a need for capacity responses including fleet expansion or replacement.
  - EV range, charging, payload, and availability constrain effective delivery capacity.

does_not_support:
  - Low fulfillment automatically causes investment.
  - Unserved demand equals vehicle shortage.
  - An exact required additional vehicle count.
  - An exact investment amount.
  - An actual corporate capital-budget decision.
  - A universal ICE-to-EV replacement ratio.

