  - id: ev_specific
    label: EV-specific evidence
    assessment: SUPPORTED_WITH_CONDITIONS
    supports: [vehicle count is not identical to effective delivery capacity, one ICE vehicle cannot ex ante be assumed equivalent to one EV, EVs are not asserted always to require more vehicles]

