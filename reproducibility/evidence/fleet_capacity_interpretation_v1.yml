    conditions: [Existing operational changes cannot accommodate the capacity requirement., Fleet expansion or replacement is only one possible response., Firm-specific constraints and decision processes remain unmodeled.]
    out_of_scope_claims: [No vehicle count, CAPEX, return metric, purchase rule, or actual investment decision is inferred.]

