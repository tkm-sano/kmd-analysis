schema_version: 1
evidence_id: EVIDENCE-FLEET-CAPACITY-INTERPRETATION-V1
lifecycle: CURRENT
artifact_role: EVIDENCE_SUPPORTED_INTERPRETATION
authority_scope: INTERPRETATION_ONLY
updated_at: '2026-09-03'
overall_assessment: SUPPORTED_WITH_CONDITIONS
direct_research_boundary: Delivery Fulfillment

scope:
  main_interpretation:
    - Delivery Fulfillment
    - Unserved Delivery Demand
    - Potential Effective Delivery-Capacity Requirement
    - Potential Need for Fleet Expansion / Replacement
  exclusions:
    - required additional vehicle count estimation
    - fleet sizing optimization
    - vehicle-price-based investment estimation
    - fleet CAPEX estimation
    - ROI / NPV / IRR
    - prediction of actual corporate investment decisions
    - universal fulfillment-to-purchase rules

wording:
  ja: 本研究ではdelivery fulfillmentの変化から企業の実際のFleet投資行動を予測しない。未充足配送需要を、必要な実効配送能力と利用可能な配送能力の潜在的ギャップを示すシグナルとして解釈する。その能力要件が既存Fleetの運用のみでは満たせない場合、Fleet増強または更新は取り得る対応の一つとなり得る。
  en: This study does not predict firms’ actual fleet-investment decisions from changes in delivery fulfillment. Instead, unserved delivery demand is interpreted as a potential signal of a gap between required and available effective delivery capacity. Where such capacity requirements cannot be accommodated by the existing fleet and its operation, fleet expansion or replacement may represent one possible downstream response.

