name: Quantitative quickstart

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quantitative:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up tested Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: reproducibility/environment/requirements-quickstart.lock.txt
      - name: Install quickstart environment
        run: |
          python -m pip install -r reproducibility/environment/requirements-quickstart.lock.txt
          python -m pip check
      - name: Verify APIs, frozen summaries and six default notebooks
        run: python -B scripts/verify_quickstart.py
